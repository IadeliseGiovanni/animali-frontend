<div class="container-fluid p-4" style="background-color: #d36e2d; min-height: 100vh">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-white fw-bold d-flex align-items-center">
      <span class="me-2">🐾</span> Gestione Animali
    </h2>
    <div class="bg-white rounded-pill px-3 py-2 shadow-sm d-flex align-items-center w-25">
      <i class="bi bi-search text-muted me-2"></i>
      <input
        type="text"
        class="form-control border-0 shadow-none p-0"
        placeholder="Cerca (Nome, Microchip...)"
      />
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-5" style="border-radius: 15px">
    <div class="card-header bg-dark text-white py-3 px-4">
      <div class="d-flex justify-content-between align-items-center">
        <h6 class="mb-0 fw-bold">REGISTRA NUOVO OSPITE</h6>
        <small class="opacity-50">* Campi obbligatori</small>
      </div>
    </div>
    <div class="card-body p-4">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">NOME *</label>
          <input
            type="text"
            class="form-control bg-light border-0"
            placeholder="Rex"
            [(ngModel)]="nuovoAnimale().nome"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">SPECIE *</label>
          <select class="form-select bg-light border-0" [(ngModel)]="nuovoAnimale().specie">
            <option value="Cane">Cane</option>
            <option value="Gatto">Gatto</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">RAZZA</label>
          <input
            type="text"
            class="form-control bg-light border-0"
            placeholder="Es: Labrador"
            [(ngModel)]="nuovoAnimale().razza"
          />
        </div>
        <div class="col-md-3">
          <label class="form-label small fw-bold text-muted">MICROCHIP *</label>
          <input
            type="text"
            class="form-control bg-light border-0"
            placeholder="Codice..."
            [(ngModel)]="nuovoAnimale().microchip"
          />
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-bold text-muted">ETÀ</label>
          <input
            type="number"
            class="form-control bg-light border-0"
            [(ngModel)]="nuovoAnimale().eta"
          />
        </div>
        <div class="col-md-2">
          <label class="form-label small fw-bold text-muted">GENERE</label>
          <select class="form-select bg-light border-0" [(ngModel)]="nuovoAnimale().genere">
            <option value="Maschio">Maschio</option>
            <option value="Femmina">Femmina</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold text-muted">URL FOTO</label>
          <input
            type="text"
            class="form-control bg-light border-0"
            placeholder="http://..."
            [(ngModel)]="nuovoAnimale().fotoUrl"
          />
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold text-muted">URL VIDEO</label>
          <input
            type="text"
            class="form-control bg-light border-0"
            placeholder="http://..."
            [(ngModel)]="nuovoAnimale().videoUrl"
          />
        </div>

        <div class="col-md-9">
          <label class="form-label small fw-bold text-muted">DESCRIZIONE / NOTE</label>
          <textarea
            class="form-control bg-light border-0"
            rows="1"
            placeholder="Racconta la sua storia..."
            [(ngModel)]="nuovoAnimale().descrizione"
          ></textarea>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-success w-100 fw-bold py-2 rounded-3" (click)="aggiungi()">
            <i class="bi bi-save me-2"></i>Salva Animale
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm" style="border-radius: 15px">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light shadow-sm">
          <tr>
            <th class="ps-4 py-3 text-secondary small fw-bold">NOME</th>
            <th class="py-3 text-secondary small fw-bold">RAZZA / SPECIE</th>
            <th class="py-3 text-secondary small fw-bold">MICROCHIP</th>
            <th class="py-3 text-secondary small fw-bold">ETÀ / GENERE</th>
            <th class="pe-4 py-3 text-end text-secondary small fw-bold">AZIONI</th>
          </tr>
        </thead>
        <tbody>
          @for (a of animali(); track a.id) {
            <tr>
              <td class="ps-4">
                <div class="d-flex align-items-center">
                  <div
                    class="rounded-circle bg-orange-light me-3 d-flex align-items-center justify-content-center"
                    style="width: 35px; height: 35px; background-color: #fef0e6"
                  >
                    <span class="small">{{ a.specie === 'Cane' ? '🐶' : '🐱' }}</span>
                  </div>
                  <strong>{{ a.nome }}</strong>
                </div>
              </td>
              <td>
                <span class="text-dark">{{ a.razza || 'N/D' }}</span
                ><br />
                <small class="text-muted">{{ a.specie }}</small>
              </td>
              <td>
                <span class="badge bg-light text-dark border font-monospace">{{
                  a.microchip
                }}</span>
              </td>
              <td>{{ a.eta }} anni - {{ a.genere }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
