<div class="register-wrapper">
  <div class="card register-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-dark">Unisciti a noi 🐶</h2>
        <p class="text-muted small text-uppercase fw-bold tracking-wider">
          Crea il tuo profilo Adottante
        </p>
      </div>

      <form (submit)="onRegister($event)">
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary text-uppercase">Nome e Cognome</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input
              type="text"
              class="form-control border-start-0 shadow-none py-2"
              [(ngModel)]="form.nome"
              name="nome"
              placeholder="Inserisci il tuo nome"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary text-uppercase">Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input
              type="email"
              class="form-control border-start-0 shadow-none py-2"
              [(ngModel)]="form.email"
              name="email"
              placeholder="esempio@email.it"
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary text-uppercase">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input
              type="password"
              class="form-control border-start-0 shadow-none py-2"
              [(ngModel)]="form.password"
              name="password"
              placeholder="Almeno 6 caratteri"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-orange w-100 py-3 fw-bold rounded-pill shadow-sm mt-2 text-white"
        >
          Registrati ora
        </button>

        <div class="text-center mt-4">
          <p class="small text-muted mb-0">
            Hai già un account?
            <a [routerLink]="['/login']" class="text-orange fw-bold text-decoration-none" style="cursor: pointer;">Accedi qui</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
