<div class="container mt-4">
  <div class="card shadow-sm">
    <div
      class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
    >
      <h4 class="mb-0">Registro Adottanti</h4>
      <div class="input-group w-50">
        <input
          type="text"
          class="form-control"
          placeholder="Cerca per cognome..."
          [(ngModel)]="searchCognome"
          (keyup.enter)="cerca()"
        />
        <button class="btn btn-light" (click)="cerca()">Cerca</button>
      </div>
    </div>

    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead class="table-light">
          <tr>
            <th>Nominativo</th>
            <th>Email</th>
            <th>Codice Fiscale</th>
            <th>Indirizzo</th>
          </tr>
        </thead>
        <tbody>
          @for (a of adottanti(); track a.id) {
            <tr>
              <td>
                <strong>{{ a.cognome }} {{ a.nome }}</strong>
              </td>
              <td>{{ a.email }}</td>
              <td>
                <code>{{ a.codiceFiscale }}</code>
              </td>
              <td>{{ a.indirizzo || 'N/D' }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center p-4">
                @if (isLoading()) {
                  Caricamento in corso...
                } @else {
                  Nessun adottante trovato.
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
