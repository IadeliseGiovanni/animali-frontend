<div class="container mt-4">
  <h2>Lista Centri</h2>
  <div class="row">
    @for (centro of centri(); track centro.id) {
      <div class="col-md-4 card p-3 m-2 shadow-sm">
        <h5>{{ centro.nomeCentro }}</h5>
        <p>{{ centro.citta }} - {{ centro.indirizzo }}</p>
        <p>Capacità: {{ centro.capacitaMassima }}</p>
      </div>
    } @empty {
      <p>Ancora nessun dato visualizzato. Controlla il tab Network.</p>
    }
  </div>
</div>
