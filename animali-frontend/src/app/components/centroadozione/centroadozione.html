<div class="container mt-4">
  <div class="card shadow-sm mb-4 border-primary">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Gestione Admin: Nuovo Centro</h4>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" [(ngModel)]="nuovoCentro().nomeCentro" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Città</label>
          <input type="text" class="form-control" [(ngModel)]="nuovoCentro().citta" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Indirizzo</label>
          <input type="text" class="form-control" [(ngModel)]="nuovoCentro().indirizzo" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Capacità</label>
          <input type="number" class="form-control" [(ngModel)]="nuovoCentro().capacitaMassima" />
        </div>
        <div class="col-12 d-flex justify-content-between align-items-center">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="noProfit"
              [(ngModel)]="nuovoCentro().isNoProfit"
            />
            <label class="form-check-label" for="noProfit">Ente No-Profit</label>
          </div>
          <button class="btn btn-success" (click)="aggiungiCentro()">
            <i class="bi bi-plus-circle"></i> Registra Centro
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-8">
      <div id="map" style="height: 400px" class="rounded shadow-sm"></div>
    </div>
    <div class="col-md-4">
      <h3>Cerca per Città</h3>
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          [(ngModel)]="cercaCitta"
          (input)="filtraPerCitta()"
          placeholder="Es: Roma"
        />
      </div>

      <div class="list-group overflow-auto" style="max-height: 300px">
        @for (centro of centri(); track centro.id) {
          <div class="list-group-item">
            <h6 class="mb-1">{{ centro.nomeCentro }}</h6>
            <small>{{ centro.indirizzo }}</small>
          </div>
        }
      </div>
    </div>
  </div>
</div>
