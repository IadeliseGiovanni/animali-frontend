<div class="container">
  <h2>Elenco Visite Mediche</h2>

  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Veterinario</th>
          <th>Esito</th>
        </tr>
      </thead>
      <tbody>
        @for (visita of visite(); track visita.id) {
          <tr>
            <td>{{ visita.data | date: 'short' }}</td>
            <td>{{ visita.veterinario }}</td>
            <td>{{ visita.esito }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3">Nessuna visita trovata.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
